<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrashX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 40px;
            position: relative;
        }
        
        header:after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, #00ff00, #00cc00);
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00ff00, #00cc00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        
        .tagline {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 20px;
        }
        
        .card {
            background: rgba(20, 20, 30, 0.8);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
            border-color: rgba(0, 255, 0, 0.3);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-title {
            font-size: 1.8rem;
            color: #00ff00;
        }
        
        .card-badge {
            background: #00aa00;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .badge-adult {
            background: #ff4444;
        }
        
        .badge-kids {
            background: #4488ff;
        }
        
        .badge-sports {
            background: #ffaa00;
        }
        
        .badge-test {
            background: #888;
        }
        
        .build-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .info-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #00ff00;
        }
        
        .info-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-weight: bold;
            color: #fff;
            word-break: break-all;
        }
        
        .description {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 30, 0, 0.2);
            border-radius: 6px;
            border-left: 3px solid #00aa00;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #00aa00, #008800);
            color: white;
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            margin-right: 10px;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            background: linear-gradient(90deg, #00cc00, #00aa00);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.2);
        }
        
        .btn-secondary {
            background: linear-gradient(90deg, #333, #222);
        }
        
        .btn-secondary:hover {
            background: linear-gradient(90deg, #444, #333);
        }
        
        .btn-downloads {
            background: linear-gradient(90deg, #0088ff, #0066cc);
        }
        
        .btn-downloads:hover {
            background: linear-gradient(90deg, #0099ff, #0077dd);
        }
        
        .downloads-section {
            margin-top: 40px;
            background: rgba(10, 10, 20, 0.9);
            border-radius: 10px;
            padding: 30px;
            text-align: center;
        }
        
        .section-title {
            font-size: 2rem;
            margin-bottom: 25px;
            color: #00ff00;
            text-align: center;
        }
        
        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .download-card {
            background: rgba(30, 30, 40, 0.8);
            border-radius: 10px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
        }
        
        .download-card:hover {
            background: rgba(40, 40, 50, 0.9);
            transform: translateY(-5px);
        }
        
        .download-icon {
            font-size: 3rem;
            color: #00ff00;
            margin-bottom: 15px;
        }
        
        .download-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #fff;
        }
        
        .category-header {
            font-size: 2rem;
            margin: 40px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(0, 255, 0, 0.3);
            color: #00ff00;
        }
        
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }
        
        .filter-btn {
            background: rgba(40, 40, 50, 0.7);
            color: #ccc;
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-btn.active, .filter-btn:hover {
            background: #00aa00;
            color: white;
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 30px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            font-size: 0.9rem;
        }
        
        .builds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }
        
        @media (max-width: 768px) {
            .builds-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .card-title {
                font-size: 1.5rem;
            }
            
            .download-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .hidden {
            display: none;
        }
        
        .no-builds {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #888;
            grid-column: 1 / -1;
        }
        
        .theme-link {
            color: #00ff00;
            text-decoration: none;
            word-break: break-all;
        }
        
        .theme-link:hover {
            text-decoration: underline;
        }
        
        .adult-warning {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.3);
            border-left: 3px solid #ff4444;
        }
        
        .search-box {
            margin: 20px 0 30px;
            display: flex;
            justify-content: center;
        }
        
        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 6px;
            background: rgba(30, 30, 40, 0.8);
            border: 1px solid rgba(0, 255, 0, 0.2);
            color: white;
            font-size: 1rem;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CrashX </h1>
        </header>
        
        <div id="buildsContainer" class="builds-grid">
        </div>
        
        <div class="downloads-section">
            <h2 class="section-title">Downloads & Repository</h2>
            
            <div class="download-grid">
                <div class="download-card">
                    <div class="download-icon">
                        <i class="fas fa-download"></i>
                    </div>

                
                <div class="download-card">
                    <div class="download-icon">
                        <i class="fas fa-box-open"></i>
                    </div>
                    <h3 class="download-title">Repository</h3>
                    <p>Offizielles Repository mit Addons und Updates</p>
                    <a href="https://teamcrashx.github.io/repo/" class="btn" target="_blank">Repository öffnen</a>
                </div>
            </div>
        </div>
        
        <footer>
            <p>CrashX &copy; 2024 | </p>
        </footer>
    </div>
    
    </script>
</body>
</html>
